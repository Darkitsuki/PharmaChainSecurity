version: '3.8'

services:
  oracle:
    image: store/oracle/database/enterprise:23.3.0
    container_name: pharmasecure-oracle
    environment:
      - ACCEPT_EULA=Y
      - ORACLE_PDB=XE
      - ORACLE_CHARACTERSET=AL32UTF8
      - ORACLE_UNQNAME=ORCL
    ports:
      - "1521:1521"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "sqlplus / as sysdba <<EOF

            SELECT 1 FROM dual;

            EXIT;

            EOF || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pharmasecure-net

  webapi:
    build:
      context: ../../backend
      dockerfile: ../deploy/docker/Dockerfile.webapi
    container_name: pharmasecure-webapi
    depends_on:
      oracle:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=oracle:1521;Database=XE;User Id=system;Password=${DB_PASSWORD};TrustServerCertificate=True;
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - Jwt__SecretKey=${JWT_SECRET}
    ports:
      - "5000:8080"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health/live" ]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - pharmasecure-net

  frontend:
    build:
      context: ../../frontend
      dockerfile: ../deploy/docker/Dockerfile.frontend
    container_name: pharmasecure-frontend
    depends_on:
      - webapi
    ports:
      - "80:80"
    networks:
      - pharmasecure-net

networks:
  pharmasecure-net:
    driver: bridge
